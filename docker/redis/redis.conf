# Basic Redis configuration for this project
# Located at ./docker/redis/redis.conf and mounted into containers via docker-compose

# Listen on all interfaces inside the container
bind 0.0.0.0
# In docker-compose development we disable protected-mode so other containers on the
# user-defined Docker network can connect. In production you should instead set a
# strong password (uncomment `requirepass`) or manage access via network/firewall.
protected-mode no

# Persistence: use AOF for durability
appendonly yes
appendfsync everysec
dir /data

# Memory policy (tune for your workload)
# Uncomment and adjust maxmemory as needed, e.g. 256mb
# maxmemory 256mb
maxmemory-policy allkeys-lru

# Security: requirepass is commented out by default. For production, set a strong password
# and enable it by uncommenting the line below and adding REDIS_PASSWORD to your env/secret store.
# requirepass YOUR_STRONG_PASSWORD_HERE

# Other recommended settings
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Do not daemonize when running in Docker
daemonize no

# Log to stdout so Docker captures logs
logfile ""

# You can add modules or additional tuning below

