[workspace]
name = "bpsee-monorepo"
description = "BPSEE Proof of Concept - 10 week project"
authors = ["Dagmar", "Demi", "Tygo", "Matthijs", "Aidan"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"

[tasks]
# Frontend tasks
dev-frontend = "cd apps/hobby-frontend && npm run dev"
build-frontend = "npm run build --workspace=apps/hobby-frontend"
lint-frontend = "npm run lint --workspace=apps/hobby-frontend"

# User Connection Service tasks
dev-connection-service = "cd apps/user-connection-service && mvn spring-boot:run"
build-connection-service = "cd apps/user-connection-service && mvn clean package -DskipTests"
test-connection-service = "cd apps/user-connection-service && mvn test"

# Post Service tasks
dev-post-service = "cd apps/post-service && mvn spring-boot:run"
build-post-service = "cd apps/post-service && mvn clean package -DskipTests"
test-post-service = "cd apps/post-service && mvn test"

# Meta tasks - runs all microservices concurrently
dev = "turbo dev --continue"
build = { depends-on = ["build-frontend", "build-connection-service"], cmd = "echo 'All services built successfully'" }
lint = "npm run lint --workspaces"

[environments]
default = { solve-group = "default", features = [] }
