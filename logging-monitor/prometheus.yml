global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'apigateway'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets:
          - middleware-service:23738
        labels:
          service: apigateway

  - job_name: 'recognition-service'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets:
          - recognition-service:27088
        labels:
          service: recognition

  - job_name: 'authentication-service'
    metrics_path: '/api/auth/metrics'
    static_configs:
      - targets:
          - authentication-service-c:21525
        labels:
          service: auth

  - job_name: 'profile-service'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets:
          - profile-service:21526
        labels:
          service: profile

  - job_name: 'interaction-service'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets:
          - interaction-service:27087
        labels:
          service: interaction

  - job_name: 'profile-connection-service'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets:
          - profile-connection-service:29574
        labels:
          service: profile-connection

  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - notification-service:29555
        labels:
          service: notification

  - job_name: 'bug-report-service'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - bug-report-service:29556
        labels:
          service: bug-report

  - job_name: 'post-service'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets:
          - post-service:29293
        labels:
          service: post

  - job_name: 'library-service'
    metrics_path: '/api/library/metrics'
    static_configs:
      - targets:
          - library-service:28877
        labels:
          service: library