server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    file_sd_configs:
      - files:
          - /etc/promtail/targets/*.json
        refresh_interval: 30s
    pipeline_stages:
      - docker: {}
      - regex:
          expression: '(?i)\b(?P<level>ERROR|WARN(?:ING)?|INFO|DEBUG|FATAL|TRACE|PANIC)\b'
      - labels:
          level: