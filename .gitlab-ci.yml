      export GRAFANA_ADMIN_PASSWORD='$GRAFANA_ADMIN_PASSWORD'
      export GRAFANA_PORT='$GRAFANA_PORT'
      export GRAFANA_PLUGINS='$GRAFANA_PLUGINS'
      export PROMETHEUS_PORT='$PROMETHEUS_PORT'
      export LOKI_PORT='$LOKI_PORT'
      export TZ='$TZ'

      # Pull all images (core + optional)
      docker compose -f docker-compose-prod.yml --profile monitoring --profile tools pull

      # Deploy core prod services — failure here fails the pipeline
      docker compose -f docker-compose-prod.yml stop frontend || true
      docker compose -f docker-compose-prod.yml rm -f frontend || true
      docker compose -f docker-compose-prod.yml up -d --remove-orphans

      # Deploy optional services — capture failure but don't abort core deploy
      OPTIONAL_EXIT=0
      docker compose -f docker-compose-prod.yml --profile monitoring --profile tools up -d || OPTIONAL_EXIT=\$?
      if [ \$OPTIONAL_EXIT -ne 0 ]; then
        echo "WARNING: One or more optional services (monitoring/docs/pgadmin) failed to start. Core services are unaffected."
        exit \$OPTIONAL_EXIT
      fi
      EOF
