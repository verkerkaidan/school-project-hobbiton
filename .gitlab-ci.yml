      export DB_NOTIFICATION_NAME='$DB_NOTIFICATION_NAME'
      export NOTIFICATION_ALLOWED_ORIGINS='$NOTIFICATION_ALLOWED_ORIGINS'
      export SPRING_DATASOURCE_CHAT_DATABASE='$SPRING_DATASOURCE_CHAT_DATABASE'
