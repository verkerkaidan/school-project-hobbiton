stages:
  - test

# Template for Maven test jobs
.maven_test_template: &maven_test_template
  stage: test
  image: maven:3.9-eclipse-temurin-21
  cache:
    paths:
      - apps/*/target/
      - ~/.m2/repository/

# Test profile-connection-service
test:profile-connection-service:
  <<: *maven_test_template
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/profile-connection-service/**/*
  script:
    - cd apps/profile-connection-service
    - mvn clean test
  artifacts:
    when: always
    reports:
      junit:
        - apps/profile-connection-service/target/surefire-reports/TEST-*.xml
    paths:
      - apps/profile-connection-service/target/surefire-reports/
      - apps/profile-connection-service/target/site/jacoco/
    expire_in: 30 days

