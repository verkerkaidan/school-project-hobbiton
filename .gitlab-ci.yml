      export NEXT_PUBLIC_AUTHENTICATION_URL='$NEXT_PUBLIC_AUTHENTICATION_URL'
      export NEXT_PUBLIC_LIBRARY_SERVICE_URL='$NEXT_PUBLIC_LIBRARY_SERVICE_URL'
