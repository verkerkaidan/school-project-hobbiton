stages:
  - validate
  - test
  - build
  - deploy

# Enforce changelog update on every merge request
check:changelog:
  stage: validate
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  before_script:
    - apk add --no-cache git
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - |
      if ! git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD | grep -q "^CHANGELOG.md$"; then
        echo "CHANGELOG.md was not updated in this merge request."
        echo "Please add an entry in CHANGELOG.md before merging."
        exit 1
      fi
      echo "CHANGELOG.md check passed."

# Template for Maven test jobs
.maven_test_template: &maven_test_template
  stage: test
  image: maven:3.9-eclipse-temurin-21
  cache:
    paths:
      - apps/*/target/
      - ~/.m2/repository/

# Test profile-connection-service
test:profile-connection-service:
  <<: *maven_test_template
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/profile-connection-service/**/*
  script:
    - cd apps/profile-connection-service
    - mvn clean test
  artifacts:
    when: always
    reports:
      junit:
        - apps/profile-connection-service/target/surefire-reports/TEST-*.xml
    paths:
      - apps/profile-connection-service/target/surefire-reports/
      - apps/profile-connection-service/target/site/jacoco/
    expire_in: 30 days

