# E2E tests — build all services and run Playwright tests
test:e2e:
  stage: e2e
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GIT_DEPTH: "1"
    COMPOSE_PROJECT_NAME: hobbithon
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - tests/**/*
        - hobby-frontend/*
        - playwright.config.ts
        - docker-compose.yml
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 2; done
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u gitlab-ci-token --password-stdin
  script:
    - |
      {
        grep -o '\${[^}]*}' docker-compose.yml \
          | sed 's/[${}]//g; s/:-.*//' \
          | sort -u \
          | while IFS= read -r name; do
              case "$name" in
                -*|'') continue ;;
              esac
              if printenv "$name" >/dev/null 2>&1; then
                printf '%s=%s\n' "$name" "$(printenv "$name")"
              fi
            done
      } > .env
    - |
      set -e
      echo "=== Building images ==="
      set +e
      docker compose build > /tmp/build.log 2>&1
      build_exit=$?
      set -e
      tail -n 100 /tmp/build.log
      if [ $build_exit -ne 0 ]; then exit $build_exit; fi
    - |
      set -e
      echo "=== Starting database first ==="
      docker compose up -d --no-build database
      echo "=== Waiting for database to be healthy ==="
      for i in $(seq 1 30); do
        status=$(docker inspect db --format '{{.State.Health.Status}}' 2>/dev/null || echo "starting")
        if [ "$status" = "healthy" ]; then
          echo "Database is healthy after ${i}x5s"
          break
        fi
        echo "  db status: $status (${i}/30)"
        sleep 5
      done
      if [ "$status" != "healthy" ]; then
        echo "Database failed to become healthy"
        docker compose logs database
        exit 1
      fi
    - |
      set -e
      echo "=== Starting all services ==="
      docker compose up -d --no-build \
      database redis rabbitmq \
      frontend middleware-service \
      post-service profile-connection-service media-service-elx recognition-service \
      authentication-service-c profile-service library-service interaction-service \
      notification-service bug-report-service chat-service; compose_exit=$?
      docker compose ps
      docker compose logs database 2>/dev/null | tail -20 || true
      docker inspect db --format '{{json .State.Health}}' 2>/dev/null || true
      if [ $compose_exit -ne 0 ]; then exit $compose_exit; fi

    - |
      docker run --rm \
        --network hobbithon-network \
        -v "$PWD":/e2e \
        -w /e2e \
        -e CI=true \
        -e PLAYWRIGHT_BASE_URL=http://frontend:19293 \
        -e GATEWAY_URL=http://apigateway-service:23738 \
        mcr.microsoft.com/playwright:v1.60.0 \
        sh -c "npm ci && mkdir -p test-results && npx playwright test"
  allow_failure: true
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 30 days
  timeout: 120m

# Build all services and push to GitLab registry
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - CHANGELOG.md
        - package.json
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GIT_DEPTH: "2"
  before_script:
    - apk add --no-cache jq git
    - |
      until docker info > /dev/null 2>&1; do
        echo "Waiting for Docker daemon..."
        sleep 1
      done
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u gitlab-ci-token --password-stdin
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
  script:
    - |
      set -e
      CHANGED=$(git diff --name-only HEAD~1 HEAD)
      DOCS_CHANGED=false
      echo "$CHANGED" | grep -q "^apps/docs/" && DOCS_CHANGED=true
      echo "$CHANGED" | grep -q "^docker/docs-auth/" && DOCS_CHANGED=true
      if [ "$DOCS_CHANGED" = "true" ]; then
        echo "Changes detected in docs or docs-proxy, building docs-proxy..."
        docker build -t "$CI_REGISTRY_IMAGE/docs-proxy:latest" docker/docs-auth
        docker push "$CI_REGISTRY_IMAGE/docs-proxy:latest"
        docker rmi "$CI_REGISTRY_IMAGE/docs-proxy:latest"
      else
        echo "No changes in docs or docs-proxy, skipping docs-proxy build."
      fi
      for SERVICE_NAME in apigateway authentication-service-c chat-service docs interaction-service library-service media_service_elx notification-service bug-report-service post-service profile-connection-service profile-service recognition-service; do
        if [ "$SERVICE_NAME" = "docs" ] && [ "$DOCS_CHANGED" = "true" ]; then
          FORCE_BUILD=true
        else
          FORCE_BUILD=false
        fi
        if [ "$FORCE_BUILD" = "true" ] || echo "$CHANGED" | grep -q "^apps/$SERVICE_NAME/"; then
          echo "Changes detected in $SERVICE_NAME, building service from scratch..."
          docker build --quiet -t "$CI_REGISTRY_IMAGE/$SERVICE_NAME:latest" "apps/$SERVICE_NAME"
          echo "Pushing $SERVICE_NAME..."
          docker push "$CI_REGISTRY_IMAGE/$SERVICE_NAME:latest"
          docker rmi "$CI_REGISTRY_IMAGE/$SERVICE_NAME:latest"
        else
          echo "No changes in $SERVICE_NAME, skipping build step."
        fi
      done
      echo "Building hobby-frontend..."
      docker build --no-cache \
        --build-arg NEXT_PUBLIC_AUTHENTICATION_URL="$NEXT_PUBLIC_AUTHENTICATION_URL" \
        --build-arg NEXT_PUBLIC_MIDDLEWARE_URL_CLIENTSIDE="$NEXT_PUBLIC_MIDDLEWARE_URL_CLIENTSIDE" \
        --build-arg NEXT_PUBLIC_MIDDLEWARE_URL_SERVERSIDE="$NEXT_PUBLIC_MIDDLEWARE_URL_SERVERSIDE" \
        --build-arg NEXT_PUBLIC_MEDIA_URL="$NEXT_PUBLIC_MEDIA_URL" \
        --build-arg NEXT_PUBLIC_INTERACTION_URL="$NEXT_PUBLIC_INTERACTION_URL" \
        --build-arg NEXT_PUBLIC_LIBRARY_SERVICE_URL="$NEXT_PUBLIC_LIBRARY_SERVICE_URL" \
        --build-arg NEXT_PUBLIC_NOTIFICATION_URL="$NEXT_PUBLIC_NOTIFICATION_URL" \
        --build-arg NEXT_PUBLIC_CHAT_SERVICE_URL="$NEXT_PUBLIC_CHAT_SERVICE_URL" \
        --build-arg NEXT_PUBLIC_WS_CHAT_SERVICE_URL="$NEXT_PUBLIC_WS_CHAT_SERVICE_URL" \
        --build-arg NEXT_PUBLIC_APP_VERSION="v$(jq -r '.version' package.json)" \
        -t "$CI_REGISTRY_IMAGE/hobby-frontend:latest" apps/hobby-frontend
      docker push "$CI_REGISTRY_IMAGE/hobby-frontend:latest"
      docker rmi "$CI_REGISTRY_IMAGE/hobby-frontend:latest"

# Deploy on Student Server
deploy:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - CHANGELOG.md
        - package.json
  variables:
    DEPLOY_USER: gl_groep-01_6306
    DEPLOY_HOST: student.inf.st.hsleiden.nl
  before_script:
    # Install SSH and SCP
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    # Add host to known_hosts
    - ssh-keyscan -t ed25519 $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
    # Configure SSH
    - printf 'Host %s\n  StrictHostKeyChecking accept-new\n' "$DEPLOY_HOST" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - scp -r docker-compose-prod.yml init-db.sh logging-monitor "$DEPLOY_USER@$DEPLOY_HOST:~/"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" bash << EOF
      set -e
      cd ~
      echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u gitlab-ci-token --password-stdin
      export CI_REGISTRY_IMAGE='$CI_REGISTRY_IMAGE'
      export POSTGRES_USER='$POSTGRES_USER'
      export POSTGRES_PASSWORD='$POSTGRES_PASSWORD'
