# Test media-service-elx
test:media-service:
  stage: test
  image: elixir:1.19.5-otp-27-alpine
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_PASSWORD: postgres
    POSTGRES_TEST_USER: postgres
    POSTGRES_TEST_PASSWORD: postgres
    POSTGRES_TEST_DB: media_service_test
    POSTGRES_TEST_HOST: postgres
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - apps/media_service_elx/**/*
  before_script:
    - apk add --no-cache postgresql-client
    - |
      export PGPASSWORD='postgres'
      until pg_isready -h postgres -U postgres -d media_service_test; do
        echo "Waiting for PostgreSQL..."
        sleep 2
      done
  script:
    - cd apps/media_service_elx
    - mix deps.get
    - mix test
  artifacts:
    when: always
    expire_in: 30 days
  cache:
    paths:
      - apps/media_service_elx/deps/
      - apps/media_service_elx/_build/

