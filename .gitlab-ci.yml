      export SPRING_DATASOURCE_CHAT_DATABASE='$SPRING_DATASOURCE_CHAT_DATABASE'
      export SPRING_DATASOURCE_USERNAME_CHAT='$SPRING_DATASOURCE_USERNAME_CHAT'
      export SPRING_DATASOURCE_PASSWORD_CHAT='$SPRING_DATASOURCE_PASSWORD_CHAT'
      export NEXT_PUBLIC_CHAT_SERVICE_URL='$NEXT_PUBLIC_CHAT_SERVICE_URL'
      export NEXT_PUBLIC_WS_CHAT_SERVICE_URL='$NEXT_PUBLIC_WS_CHAT_SERVICE_URL'
      export PGADMIN_DEFAULT_EMAIL='$PGADMIN_DEFAULT_EMAIL'
      export PGADMIN_DEFAULT_PASSWORD='$PGADMIN_DEFAULT_PASSWORD'
      export CHAT_HTTP_URL='$CHAT_HTTP_URL'
      export CHAT_WS_URL='$CHAT_WS_URL'
      export CHAT_DB_CONNECTION_STRING='$CHAT_DB_CONNECTION_STRING'
      export MIDDLEWARE_ALLOWED_ORIGINS='$MIDDLEWARE_ALLOWED_ORIGINS'
      export CHAT_ALLOWED_ORIGINS='$CHAT_ALLOWED_ORIGINS'
      export GATEWAY_ALLOWED_ORIGIN_PATTERNS='$GATEWAY_ALLOWED_ORIGIN_PATTERNS'
      export BUG_REPORT_SERVICE_URL='$BUG_REPORT_SERVICE_URL'
      export DB_BUGREPORT_USER='$DB_BUGREPORT_USER'
      export DB_BUGREPORT_PASSWORD='$DB_BUGREPORT_PASSWORD'
      export DB_BUGREPORT_NAME='$DB_BUGREPORT_NAME'
      export BUG_REPORT_ALLOWED_ORIGINS='$BUG_REPORT_ALLOWED_ORIGINS'
      export DOCS_USER='$DOCS_USER'
      export DOCS_PASSWORD='$DOCS_PASSWORD'
      export RABBITMQ_DEFAULT_USER='$RABBITMQ_DEFAULT_USER'
      export RABBITMQ_DEFAULT_PASS='$RABBITMQ_DEFAULT_PASS'
      export GRAFANA_ADMIN_USER='$GRAFANA_ADMIN_USER'
      export GRAFANA_ADMIN_PASSWORD='$GRAFANA_ADMIN_PASSWORD'
      export GRAFANA_PORT='$GRAFANA_PORT'
      export GRAFANA_PLUGINS='$GRAFANA_PLUGINS'
      export PROMETHEUS_PORT='$PROMETHEUS_PORT'
      export LOKI_PORT='$LOKI_PORT'
      export TZ='$TZ'
      export LOKI_URL='$LOKI_URL'
      export SECRET_KEY_BASE='$SECRET_KEY_BASE'

      # Pull all images (core + optional)
      docker compose -f docker-compose-prod.yml --profile docs --profile logging-monitor --profile tools pull

      # 1. Core services — essential, must succeed
      CORE_EXIT=0
      docker compose -f docker-compose-prod.yml stop frontend || true
      docker compose -f docker-compose-prod.yml rm -f frontend || true
      docker compose -f docker-compose-prod.yml up -d --remove-orphans || CORE_EXIT=\$?
      [ \$CORE_EXIT -ne 0 ] && echo "ERROR: Core services failed to start (exit \$CORE_EXIT)."

      # 2. PgAdmin
      PGADMIN_EXIT=0
      docker compose -f docker-compose-prod.yml --profile pgadmin up -d || PGADMIN_EXIT=\$?
      [ \$PGADMIN_EXIT -ne 0 ] && echo "ERROR: pgadmin failed to start (exit \$PGADMIN_EXIT)."

      # 3. Docs & docs-proxy
      DOCS_EXIT=0
      docker compose -f docker-compose-prod.yml --profile docs up -d || DOCS_EXIT=\$?
      [ \$DOCS_EXIT -ne 0 ] && echo "ERROR: docs/docs-proxy failed to start (exit \$DOCS_EXIT)."

      # 4. Generate Promtail file_sd targets from running containers
      # Uses docker ps (no sudo needed — student user has Docker socket access)
      mkdir -p /tmp/promtail-targets
      printf '' > /tmp/promtail-targets/containers.json
      sep=''
      docker ps --format='{{.ID}} {{.Names}}' | while read id name; do
          case "\$name" in
              middleware-service) name="apigateway-service" ;;
              media-service-elx) name="media-service" ;;
          esac
          log="/var/lib/docker/containers/\$id/\${id}-json.log"
          if [ -f "\$log" ]; then
              printf '%s{"targets":["localhost"],"labels":{"__path__":"%s","container":"%s","stream":"stdout"}}' "\$sep" "\$log" "\$name" >> /tmp/promtail-targets/containers.json
              sep=','
          fi
      done
      # Wrap in JSON array
      sed -i 's/^/[/;s/$/]/' /tmp/promtail-targets/containers.json
      echo "Generated targets"

      # 5. Logging & monitoring (Grafana, Loki, Prometheus, Promtail)
      LOGGING_EXIT=0
      docker compose -f docker-compose-prod.yml --profile logging-monitor up -d || LOGGING_EXIT=\$?
      [ \$LOGGING_EXIT -ne 0 ] && echo "ERROR: logging-monitor services failed to start (exit \$LOGGING_EXIT)."

      # Fail the pipeline if any group failed
      COMBINED_EXIT=\$((CORE_EXIT + PGADMIN_EXIT + DOCS_EXIT + LOGGING_EXIT))
      [ \$COMBINED_EXIT -ne 0 ] && exit 1 || true
      EOF
