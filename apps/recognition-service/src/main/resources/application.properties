spring.application.name=recognition-service

server.port=27088

server.servlet.context-path=/api
ai.djl.default_engine=PyTorch

ai.model.path=/app/models

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:23738}

# Multipart file size limits
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=180MB

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=recognition-service
management.endpoints.web.base-path=/actuator
