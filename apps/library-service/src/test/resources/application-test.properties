# Gebruik een in-memory database voor tests (H2 is hier koning)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Dummy API keys zodat de @Value annotaties niet falen
omdb.api.key=test_key_123
omdb.api.url=http://localhost:8090