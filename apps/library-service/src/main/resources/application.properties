spring.application.name=library-service
spring.datasource.url=${SPRING_DATASOURCE_LIBRARY_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME_LIBRARY}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_LIBRARY}
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
server.port=8087
omdb.api.key=${OMDB_API_KEY}
omdb.api.url=${OMDB_API_URL}
