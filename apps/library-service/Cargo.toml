[package]
name = "library_service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "library_service"
path = "src/main.rs"

[lib]
name = "library_service"
path = "src/lib.rs"
[dependencies]
# Web framework (NOT Rocket — using Axum)
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }

# HTTP client for calling external APIs
reqwest = { version = "0.13.4", features = ["json", "rustls", "query"], default-features = false }

# Serialization / Deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3.20.0"

# Error handling
anyhow = "1"
thiserror = "2.0.18"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait support
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# ENV vars
dotenvy = "0.15"

# Redis cache
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }

axum-test = "20.1.0"

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
