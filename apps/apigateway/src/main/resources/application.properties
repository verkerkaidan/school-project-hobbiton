spring.application.name=apigateway
server.port=23738
server.servlet.context-path=/api

spring.cloud.openfeign.okhttp.enabled=true

spring.graphql.cors.allowed-origins=http://localhost:3000,http://localhost:19293
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.allowed-headers=*

auth.service.url=${AUTHENTICATION_SERVICE_URL}
media.service.url=${MEDIA_SERVICE_URL}
notification.service.url=${NOTIFICATION_SERVICE_URL}
post.service.url=${POST_SERVICE_URL}
profile.service.url=${PROFILE_SERVICE_URL}
profile-connection.service.url=${PROFILE_CONNECTION_SERVICE_URL}
recognition.service.url=${RECOGNITION_SERVICE_URL}
interaction.service.url=${INTERACTION_SERVICE_URL}

chat.http-url=${CHAT_HTTP_URL}
chat.ws-url=${CHAT_WS_URL}

library.service.url=${LIBRARY_SERVICE_URL}
bug-report.service.url=${BUG_REPORT_SERVICE_URL}

# Multipart file size limits
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=180MB

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=middleware-service
management.endpoints.web.base-path=/actuator