spring.application.name=profile-service
spring.config.import=optional:dotenv:

spring.datasource.url=jdbc:postgresql://localhost:5432/${PROFILE_DATABASE}
spring.datasource.username=${USERNAME_PROFILE}
spring.datasource.password=${PASSWORD_PROFILE}

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=21526

server.servlet.context-path=/api

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:23738}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}
jwt.expiration=36000