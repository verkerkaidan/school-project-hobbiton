services:
  frontend:
    build:
      context: ./apps/hobby-frontend
      args:
        NEXT_PUBLIC_MIDDLEWARE_URL_SERVERSIDE: ${NEXT_PUBLIC_MIDDLEWARE_URL_SERVERSIDE}
        NEXT_PUBLIC_MIDDLEWARE_URL_CLIENTSIDE: ${NEXT_PUBLIC_MIDDLEWARE_URL_CLIENTSIDE}
        NEXT_PUBLIC_AUTHENTICATION_URL: ${NEXT_PUBLIC_AUTHENTICATION_URL}
        NEXT_PUBLIC_LIBRARY_SERVICE_URL: ${NEXT_PUBLIC_LIBRARY_SERVICE_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_INTERACTION_URL: ${NEXT_PUBLIC_INTERACTION_URL}
        NEXT_PUBLIC_WS_CHAT_SERVICE_URL: ${NEXT_PUBLIC_WS_CHAT_SERVICE_URL}
        NEXT_PUBLIC_CHAT_SERVICE_URL: ${NEXT_PUBLIC_CHAT_SERVICE_URL}
        NEXT_PUBLIC_NOTIFICATION_URL: ${NEXT_PUBLIC_NOTIFICATION_URL}

    container_name: frontend
    restart: always
    ports:
      - "19293:19293"
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    cpus: 0.5
    mem_limit: 256m
    env_file:
      - .env
    ports:
      - "8000:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    networks:
      - microservices-network

  database:
    image: postgres:16
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  post-service:
    build:
      context: ./apps/post-service
    container_name: post-service
    restart: always
    ports:
      - "29293:29293"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_POSTS_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_POSTS}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_POSTS}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  profile-connection-service:
    build:
      context: ./apps/profile-connection-service
    container_name: profile-connection-service
    restart: always
    ports:
      - "29574:29574"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_PROFILE_CONNECTION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PROFILE_CONNECTION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROFILE_CONNECTION}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      PROFILE_SERVICE_URL: http://profile-service:21526
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  media-service-elx:
    build:
      context: ./apps/media_service_elx
    container_name: media-service
    restart: always
    ports:
      - "27086:27086"
    environment:
      PORT: "27086"
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${SPRING_DATASOURCE_MEDIA_DATABASE}
      DB_USERNAME: ${SPRING_DATASOURCE_USERNAME_MEDIA}
      DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_MEDIA}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    cpus: 0.5
    mem_limit: 256m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  recognition-service:
    build:
      context: ./apps/recognition-service
    container_name: recognition-service
    environment:
      MODEL_NAME: ${RECOGNITION_MODEL_NAME}
    restart: always
    ports:
      - "27088:27088"
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network

  authentication-service:
    build: ./apps/authentication-service
    container_name: authentication-service
    restart: always
    ports:
      - "21525:21525"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_AUTHENTICATION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_AUTHENTICATION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_AUTHENTICATION}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      ADMIN_TEST_USER: ${ADMIN_TEST_USER}
      ADMIN_TEST_PASSWORD: ${ADMIN_TEST_PASSWORD}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  profile-service:
    build: ./apps/profile-service
    container_name: profile-service
    restart: no
    ports:
      - "21526:21526"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_PROFILE_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PROFILE}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROFILE}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_TEST_USER: ${ADMIN_TEST_USER}
      ADMIN_TEST_PASSWORD: ${ADMIN_TEST_PASSWORD}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  library-service:
    build:
      context: ./apps/library-service-rust
    container_name: library-service
    restart: no
    ports:
      - "28877:28877"
    environment:
      OMDB_API_KEY: ${OMDB_API_KEY}
      OMDB_API_URL: ${OMDB_API_URL}
      # Ensure containers use the internal redis service when running via docker-compose
      REDIS_URL: "redis://redis:6379"
    cpus: 0.5
    mem_limit: 128m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  interaction-service:
    build:
      context: ./apps/interaction-service
    container_name: interaction-service
    restart: always
    ports:
      - "27087:27087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_INTERACTION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_INTERACTION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_INTERACTION}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  notification-service:
    build:
      context: ./apps/notification-service
    container_name: notification-service
    restart: always
    ports:
      - "29555:29555"
    environment:
      PORT: 29555
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_NOTIFICATION_USER}
      DB_PASSWORD: ${DB_NOTIFICATION_PASSWORD}
      DB_NAME: ${DB_NOTIFICATION_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      NOTIFICATION_ALLOWED_ORIGINS: ${NOTIFICATION_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 128m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  middleware-service:
    build:
      context: ./apps/apigateway
    container_name: apigateway-service
    restart: always
    ports:
      - "23738:23738"
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    environment:
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL}
      POST_SERVICE_URL: ${POST_SERVICE_URL}
      RECOGNITION_SERVICE_URL: ${RECOGNITION_SERVICE_URL}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      PROFILE_CONNECTION_SERVICE_URL: ${PROFILE_CONNECTION_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      INTERACTION_SERVICE_URL: ${INTERACTION_SERVICE_URL}

  chat-service:
    build:
      context: ./apps/chat-service
    container_name: chat-service
    restart: always
    ports:
      - "29294:29294"
    cpus: 0.5
    mem_limit: 256m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  docs:
    build:
      context: ./apps/docs
    container_name: docs
    restart: unless-stopped
    ports:
      - "3001:3001"
    cpus: 0.25
    mem_limit: 128m
    networks:
      - microservices-network

  redis:
    image: redis:7-alpine
    container_name: library_redis
    restart: unless-stopped
    # Expose port on host for local development. In production you can remove the ports mapping
    # if you don't want Redis reachable from the host.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    cpus: 0.5
    mem_limit: 64m
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  microservices-network:
    name: hobbithon-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
