services:
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    env_file:
      - .env
    ports:
      - "8000:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    links:
      - "database:database"
    networks:
      - microservices-network
  database:
    image: postgres:16
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    cpus: 1
    mem_limit: 1024m
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  post-service:
    build: ./apps/post-service
    restart: always
    container_name: post-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_POSTS_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_POSTS}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_POSTS}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  profile-connection-service:
    build: ./apps/profile-connection-service
    container_name: profile-connection-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_PROFILE_CONNECTION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PROFILE_CONNECTION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROFILE_CONNECTION}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  media-service:
    build: ./apps/media-service
    container_name: media-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_MEDIA_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_MEDIA}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_MEDIA}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  feed-service:
    build: ./apps/feed-service
    container_name: feed-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_FEED_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_FEED}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_FEED}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  recognition-service:
    build: ./apps/recognition-service
    container_name: recognition-service
    restart: always
    ports:
      - "8084:8084"
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network

  library-service:
    build: ./apps/library-service
    container_name: library-service
    restart: no
    ports:
      - "8087:8087"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_LIBRARY_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_LIBRARY}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_LIBRARY}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

networks:
  microservices-network:
    name: microservices-network
    driver: bridge
volumes:
  postgres_data:
