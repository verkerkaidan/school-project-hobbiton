services:
  frontend:
    build:
      context: ./apps/hobby-frontend
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - microservices-network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    env_file:
      - .env
    ports:
      - "8000:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    networks:
      - microservices-network

  database:
    image: postgres:16
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    cpus: 1
    mem_limit: 1024m
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  post-service:
    build:
      context: ./apps/post-service
    container_name: post-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_POSTS_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_POSTS}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_POSTS}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  profile-connection-service:
    build:
      context: ./apps/profile-connection-service
    container_name: profile-connection-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_PROFILE_CONNECTION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PROFILE_CONNECTION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROFILE_CONNECTION}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  media-service:
    build:
      context: ./apps/media-service
    container_name: media-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_MEDIA_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_MEDIA}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_MEDIA}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  feed-service:
    build:
      context: ./apps/feed-service
    container_name: feed-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_FEED_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_FEED}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_FEED}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  recognition-service:
    build:
      context: ./apps/recognition-service
    container_name: recognition-service
    restart: always
    ports:
      - "8084:8084"
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network

  authentication-service:
    build: ./apps/authentication-service
    container_name: authentication-service
    restart: no
    ports:
      - "8085:8085"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_AUTHENTICATION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_AUTHENTICATION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_AUTHENTICATION}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  profile-service:
    build: ./apps/profile-service
    container_name: profile-service
    restart: no
    ports:
      - "8086:8086"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_PROFILE_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PROFILE}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROFILE}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_TEST_USER: ${ADMIN_TEST_USER}
      ADMIN_TEST_PASSWORD: ${ADMIN_TEST_PASSWORD}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  library-service:
    build:
      context: ./apps/library-service
    container_name: library-service
    restart: no
    ports:
      - "8087:8087"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_LIBRARY_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_LIBRARY}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_LIBRARY}
      OMDB_API_KEY: ${OMDB_API_KEY}
      OMDB_API_URL: ${OMDB_API_URL}
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

networks:
  microservices-network:
    name: microservices-network
    driver: bridge

volumes:
  postgres_data: