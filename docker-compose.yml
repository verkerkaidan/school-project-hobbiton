services:
  database:
    image: postgres:16
    container_name: db
    env_file:
      - .env
    ports:
      - '5432:5432'
    cpus: 1
    mem_limit: 1024m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  post-service:
    build: ./post-service
    container_name: post-service
    ports:
      - '8080:8080'
    env_file:
      - .env
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network

networks:
  microservices-network:
    name: microservices-network
    driver: bridge
volumes:
  postgres_data: