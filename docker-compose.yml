services:
  database:
    image: postgres:16
    container_name: db
    env_file:
      - .env
    ports:
      - "5432:5432"
    cpus: 1
    mem_limit: 1024m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  post-service:
    build: ./apps/post-service
    container_name: post-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      - database

  user-connection-service:
    build: ./apps/user-connection-service
    container_name: user-connection-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    cpus: 2
    mem_limit: 2048m
    networks:
      - microservices-network
    depends_on:
      - database

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    cpus: 0.5
    mem_limit: 1024m
    env_file:
      - .env
    ports:
      - "8000:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    links:
      - "database:database"
    networks:
      - microservices-network

  hobby-frontend:
    build: ./apps/hobby-frontend
    container_name: hobby-frontend
    ports:
      - "3000:3000"
    cpus: 1
    mem_limit: 1024m
    networks:
      - microservices-network

networks:
  microservices-network:
    name: microservices-network
    driver: bridge
volumes:
  postgres_data:
