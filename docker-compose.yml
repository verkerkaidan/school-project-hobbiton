services:
  frontend:
    build:
      context: ./apps/hobby-frontend
      args:
        NEXT_PUBLIC_MIDDLEWARE_URL_SERVERSIDE: ${NEXT_PUBLIC_MIDDLEWARE_URL_SERVERSIDE}
        NEXT_PUBLIC_MIDDLEWARE_URL_CLIENTSIDE: ${NEXT_PUBLIC_MIDDLEWARE_URL_CLIENTSIDE}
        NEXT_PUBLIC_AUTHENTICATION_URL: ${NEXT_PUBLIC_AUTHENTICATION_URL}
        NEXT_PUBLIC_LIBRARY_SERVICE_URL: ${NEXT_PUBLIC_LIBRARY_SERVICE_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_INTERACTION_URL: ${NEXT_PUBLIC_INTERACTION_URL}
        NEXT_PUBLIC_WS_CHAT_SERVICE_URL: ${NEXT_PUBLIC_WS_CHAT_SERVICE_URL}
        NEXT_PUBLIC_CHAT_SERVICE_URL: ${NEXT_PUBLIC_CHAT_SERVICE_URL}
        NEXT_PUBLIC_NOTIFICATION_URL: ${NEXT_PUBLIC_NOTIFICATION_URL}

    container_name: frontend
    restart: always
    ports:
      - "19293:19293"
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    cpus: 0.5
    mem_limit: 256m
    env_file:
      - .env
    ports:
      - "8000:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    networks:
      - microservices-network

  database:
    image: postgres:16
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  post-service:
    build:
      context: ./apps/post-service
    container_name: post-service
    restart: always
    ports:
      - "29293:29293"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_POSTS_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_POSTS}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_POSTS}
      CORS_ALLOWED_ORIGINS: ${MIDDLEWARE_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  profile-connection-service:
    build:
      context: ./apps/profile-connection-service
    container_name: profile-connection-service
    restart: always
    ports:
      - "29574:29574"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_PROFILE_CONNECTION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PROFILE_CONNECTION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROFILE_CONNECTION}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      PROFILE_SERVICE_URL: http://profile-service:21526
      CORS_ALLOWED_ORIGINS: ${MIDDLEWARE_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  media-service-elx:
    build:
      context: ./apps/media_service_elx
    container_name: media-service
    restart: always
    ports:
      - "27086:27086"
    environment:
      PORT: "27086"
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${SPRING_DATASOURCE_MEDIA_DATABASE}
      DB_USERNAME: ${SPRING_DATASOURCE_USERNAME_MEDIA}
      DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_MEDIA}
      CORS_ALLOWED_ORIGINS: ${MIDDLEWARE_ALLOWED_ORIGINS}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    cpus: 0.5
    mem_limit: 256m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  recognition-service:
    build:
      context: ./apps/recognition-service
    container_name: recognition-service
    environment:
      MODEL_URL: ${RECOGNITION_MODEL_URL}
      CORS_ALLOWED_ORIGINS: ${MIDDLEWARE_ALLOWED_ORIGINS}
    restart: always
    ports:
      - "27088:27088"
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network

  authentication-service-c:
    build: ./apps/authentication-service-c
    container_name: authentication-service-c
    restart: always
    ports:
      - "21525:21525"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_AUTHENTICATION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_AUTHENTICATION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_AUTHENTICATION}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      ADMIN_TEST_USER: ${ADMIN_TEST_USER}
      ADMIN_TEST_PASSWORD: ${ADMIN_TEST_PASSWORD}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  profile-service:
    build: ./apps/profile-service
    container_name: profile-service
    restart: no
    ports:
      - "21526:21526"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_PROFILE_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PROFILE}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROFILE}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_TEST_USER: ${ADMIN_TEST_USER}
      ADMIN_TEST_PASSWORD: ${ADMIN_TEST_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${MIDDLEWARE_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  library-service:
    build:
      context: ./apps/library-service
    container_name: library-service
    restart: no
    ports:
      - "28877:28877"
    environment:
      OMDB_API_KEY: ${OMDB_API_KEY}
      OMDB_API_URL: ${OMDB_API_URL}
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: postgresql://${SPRING_DATASOURCE_USERNAME_LIBRARY}:${SPRING_DATASOURCE_PASSWORD_LIBRARY}@database:5432/${SPRING_DATASOURCE_LIBRARY_DATABASE}
      RUST_LOG: debug
      CORS_ALLOWED_ORIGINS: ${MIDDLEWARE_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 256m          # bump from 128m — sqlx + migrations need headroom
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  interaction-service:
    build:
      context: ./apps/interaction-service
    container_name: interaction-service
    restart: always
    ports:
      - "27087:27087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${SPRING_DATASOURCE_INTERACTION_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_INTERACTION}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_INTERACTION}
      CORS_ALLOWED_ORIGINS: ${MIDDLEWARE_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  notification-service:
    build:
      context: ./apps/notification-service
    container_name: notification-service
    restart: always
    ports:
      - "29555:29555"
    environment:
      PORT: 29555
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_NOTIFICATION_USER}
      DB_PASSWORD: ${DB_NOTIFICATION_PASSWORD}
      DB_NAME: ${DB_NOTIFICATION_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      NOTIFICATION_ALLOWED_ORIGINS: ${NOTIFICATION_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 128m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  bug-report-service:
    build:
      context: ./apps/bug-report-service
    container_name: bug-report-service
    restart: always
    ports:
      - "29556:29556"
    environment:
      PORT: 29556
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_BUGREPORT_USER}
      DB_PASSWORD: ${DB_BUGREPORT_PASSWORD}
      DB_NAME: ${DB_BUGREPORT_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      BUG_REPORT_ALLOWED_ORIGINS: ${BUG_REPORT_ALLOWED_ORIGINS}
    cpus: 0.5
    mem_limit: 128m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy

  middleware-service:
    build:
      context: ./apps/apigateway
    container_name: apigateway-service
    restart: always
    ports:
      - "23738:23738"
    cpus: 0.5
    mem_limit: 512m
    networks:
      - microservices-network
    environment:
      AUTHENTICATION_SERVICE_URL: ${AUTHENTICATION_SERVICE_URL}
      MEDIA_SERVICE_URL: ${MEDIA_SERVICE_URL}
      POST_SERVICE_URL: ${POST_SERVICE_URL}
      RECOGNITION_SERVICE_URL: ${RECOGNITION_SERVICE_URL}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      PROFILE_CONNECTION_SERVICE_URL: ${PROFILE_CONNECTION_SERVICE_URL}
      LIBRARY_SERVICE_URL: ${LIBRARY_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      INTERACTION_SERVICE_URL: ${INTERACTION_SERVICE_URL}
      CHAT_HTTP_URL: ${CHAT_HTTP_URL}
      CHAT_WS_URL: ${CHAT_WS_URL}
      GATEWAY_ALLOWED_ORIGIN_PATTERNS: ${GATEWAY_ALLOWED_ORIGIN_PATTERNS}
      BUG_REPORT_SERVICE_URL: ${BUG_REPORT_SERVICE_URL}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  chat-service:
    build:
      context: ./apps/chat-service
    container_name: chat-service
    restart: always
    ports:
      - "29294:29294"
    cpus: 0.5
    mem_limit: 256m
    networks:
      - microservices-network
    depends_on:
      database:
        condition: service_healthy
    environment:
      - CHAT_DB_CONNECTION_STRING=${CHAT_DB_CONNECTION_STRING}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - CHAT_ALLOWED_ORIGINS=${CHAT_ALLOWED_ORIGINS}


  docs:
    build:
      context: ./apps/docs
    container_name: docs
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    networks:
      - microservices-network

  docs-proxy:
    build:
      context: ./docker/docs-auth
    container_name: docs-proxy
    restart: unless-stopped
    ports:
      - "13001:13001"
    environment:
      DOCS_USER: ${DOCS_USER}
      DOCS_PASSWORD: ${DOCS_PASSWORD}
    cpus: 0.25
    mem_limit: 64m
    networks:
      - microservices-network
    depends_on:
      - docs

  redis:
    image: redis:7-alpine
    container_name: library_redis
    restart: unless-stopped
    # Expose port on host for local development. In production you can remove the ports mapping
    # if you don't want Redis reachable from the host.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    cpus: 0.5
    mem_limit: 64m
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "21527:5672"
      - "11527:11527"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    networks:
      - microservices-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - microservices-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yml
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - microservices-network
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=${TZ:-UTC}
    networks:
      - microservices-network
    depends_on:
      - middleware-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-23333}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}
      TZ: ${TZ:-UTC}
    networks:
      - microservices-network
    depends_on:
      - prometheus

networks:
  microservices-network:
    name: hobbithon-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data: